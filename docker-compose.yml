services:
  db:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      AUTH_COOKIE_SECURE: "false"
      AUDIT_CHECKPOINT_DIR: /var/lib/auction-audit
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CATALOG_PROVIDER: ${CATALOG_PROVIDER:-cleveland}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    volumes:
      - ./.local/audit-checkpoints:/var/lib/auction-audit
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5175:5175"
    environment:
      API_PROXY_TARGET: http://api:3000
      DEV_SERVER_PORT: "5175"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
